name: noaslr-maps
on: push
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: run
        run: |
          docker run -d --name phpmap php:8.5.11-apache bash -c "which setarch; setarch x86_64 -R true && echo SETARCH_OK; apache2-foreground > /ap.log 2>&1 & sleep 6; pgrep -a apache2 | head -3; tail -5 /ap.log; pid=\$(pgrep -o apache2); echo PID=\$pid; grep libphp /proc/\$pid/maps | head -6; echo ---; curl -s -o /dev/null -w 'http:%{http_code}\n' http://127.0.0.1/"
          sleep 40
          docker logs phpmap 2>&1 | tee maps.txt
      - name: show
        run: cat maps.txt
